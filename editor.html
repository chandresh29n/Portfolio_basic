<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>Portfolio Editor</title>
  <style>
    :root { --ink:#15131c; --mute:#6b6878; --line:#e4e0d8; --bg:#f7f4ef; --card:#fff; --a:#b0204f; --b:#424be0; }
    * { box-sizing: border-box; }
    body { margin:0; font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif; background:var(--bg); color:var(--ink); }
    header { position:sticky; top:0; z-index:5; display:flex; flex-wrap:wrap; gap:.6rem; align-items:center; justify-content:space-between; padding:.8rem 1.2rem; background:rgba(255,255,255,.92); backdrop-filter:blur(10px); border-bottom:1px solid var(--line); }
    header h1 { font-size:1.05rem; margin:0; }
    header div { display:flex; gap:.5rem; flex-wrap:wrap; }
    button { font:inherit; font-weight:600; padding:.55rem 1rem; border-radius:10px; border:1px solid var(--line); background:#fff; cursor:pointer; }
    button:hover { border-color:var(--ink); }
    button.primary { background:linear-gradient(120deg,var(--a),var(--b)); color:#fff; border:0; }
    button.small { padding:.3rem .7rem; font-size:.85rem; }
    button.danger { color:#c0262d; }
    main { max-width:820px; margin:1.4rem auto 4rem; padding:0 1rem; display:grid; gap:1.2rem; }
    .tip { background:#fff7e0; border:1px solid #f1dc9a; border-radius:12px; padding:.8rem 1rem; font-size:.9rem; }
    fieldset { border:1px solid var(--line); border-radius:16px; background:var(--card); padding:1.1rem 1.2rem 1.3rem; margin:0; }
    legend { font-weight:700; padding:0 .5rem; }
    label { display:block; font-size:.82rem; font-weight:600; color:var(--mute); margin-top:.8rem; }
    input[type=text], input[type=email], textarea { width:100%; margin-top:.25rem; padding:.6rem .7rem; font:inherit; color:var(--ink); border:1px solid var(--line); border-radius:10px; background:#fdfcf9; }
    input:focus, textarea:focus { outline:2px solid rgba(66,75,224,.35); border-color:var(--b); }
    textarea { min-height:84px; resize:vertical; }
    .row { display:grid; grid-template-columns:1fr 1fr; gap:.8rem; }
    .check { display:flex; align-items:center; gap:.5rem; margin-top:.9rem; font-weight:500; color:var(--ink); }
    .item { border:1px dashed var(--line); border-radius:12px; padding:.2rem .9rem .9rem; margin-top:.9rem; background:#fffdf9; }
    .item-head { display:flex; justify-content:space-between; align-items:center; margin-top:.7rem; font-weight:700; font-size:.9rem; }
    .hint { color:var(--mute); font-size:.8rem; margin:.3rem 0 0; }
    #toast { position:fixed; left:50%; bottom:1.4rem; transform:translate(-50%,40px); opacity:0; background:var(--ink); color:#fff; padding:.7rem 1.2rem; border-radius:999px; transition:.35s; pointer-events:none; }
    #toast.show { transform:translate(-50%,0); opacity:1; }
    @media (max-width:600px) { .row { grid-template-columns:1fr; } }
  </style>
</head>
<body>
  <header>
    <h1>Portfolio Editor</h1>
    <div>
      <button id="btnPreview">Preview</button>
      <button id="btnCopy">Copy data.js</button>
      <button id="btnDownload" class="primary">Download data.js</button>
    </div>
  </header>

  <main>
    <div class="tip"><b>How it works:</b> change anything below, press <b>Download data.js</b>, then replace the old <code>data.js</code> in your portfolio folder with the new one (and upload it to GitHub). Photos and the resume PDF are replaced by swapping the files inside <code>assets/</code>. Use <b>Preview</b> to see your edits before saving.</div>
    <form id="form" autocomplete="off"></form>
  </main>
  <div id="toast"></div>

  <script src="data.js"></script>
  <script>
  (function () {
    "use strict";
    var D = JSON.parse(JSON.stringify(PORTFOLIO));
    var form = document.getElementById("form");
    var esc = function (t) { return String(t == null ? "" : t).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); };

    function text(id, label, val, type) { return '<label>' + label + '<input type="' + (type || "text") + '" data-k="' + id + '" value="' + esc(val) + '"></label>'; }
    function area(id, label, val, hint) { return '<label>' + label + '<textarea data-k="' + id + '">' + esc(val) + '</textarea></label>' + (hint ? '<p class="hint">' + hint + '</p>' : ""); }
    function lines(a) { return (a || []).join("\n"); }

    function render() {
      var h = "";
      h += '<fieldset><legend>Basics</legend>' +
        text("name", "Display name", D.name) + text("title", "Professional title", D.title) +
        '<div class="row">' + text("location", "Location", D.location) + text("availability", "Availability line", D.availability) + '</div>' +
        area("roles", "Typing animation lines", lines(D.roles), "One per line.") +
        text("siteTitle", "Browser tab title", D.siteTitle) + text("siteDescription", "Search-engine description", D.siteDescription) + '</fieldset>';

      h += '<fieldset><legend>Contact & links</legend><div class="row">' +
        text("email", "Email", D.email, "email") + text("phone", "Phone", D.phone) + '</div>' +
        '<label class="check"><input type="checkbox" data-k="enable3D" ' + (D.enable3D !== false ? "checked" : "") + '> Show the 3D animated background</label>' +
        '<label class="check"><input type="checkbox" data-k="showPhone" ' + (D.showPhone ? "checked" : "") + '> Show my phone number on the public site</label>' +
        '<div class="row">' + text("social.github", "GitHub URL", D.social.github) + text("social.linkedin", "LinkedIn URL", D.social.linkedin) + '</div>' +
        text("formEndpoint", "Formspree URL (optional, receives form messages)", D.formEndpoint) + '</fieldset>';

      h += '<fieldset><legend>Files in assets/</legend><div class="row">' +
        text("photo.illustrated", "Illustrated photo", D.photo.illustrated) + text("photo.original", "Real photo", D.photo.original) + '</div>' +
        text("resumeFile", "Resume PDF", D.resumeFile) + '</fieldset>';

      h += '<fieldset><legend>About</legend>' + area("about.summary", "Main paragraph", D.about.summary) +
        area("about.secondary", "Second paragraph", D.about.secondary) + area("about.interests", "Interests", lines(D.about.interests), "One per line.") + '</fieldset>';

      h += list("stats", "Hero numbers", D.stats, "Number", function (it, i) {
        return '<div class="row">' + text("stats." + i + ".value", "Number", it.value) + text("stats." + i + ".suffix", "Suffix (e.g. %)", it.suffix) + '</div>' + text("stats." + i + ".label", "Label", it.label);
      }, { value: 0, suffix: "", label: "" });

      h += list("skills", "Skill groups", D.skills, "Group", function (it, i) {
        return text("skills." + i + ".group", "Group name", it.group) +
          '<label>Icon<input type="text" data-k="skills.' + i + '.icon" value="' + esc(it.icon) + '"></label><p class="hint">Icons: code, layers, tool, cpu, bulb</p>' +
          area("skills." + i + ".items", "Skills", lines(it.items), "One per line.");
      }, { group: "New group", icon: "code", items: [] });

      h += list("projects", "Projects", D.projects, "Project", function (it, i) {
        return text("projects." + i + ".name", "Project name", it.name) +
          area("projects." + i + ".description", "Bullet points", lines(it.description), "One per line.") +
          area("projects." + i + ".stack", "Tech used", lines(it.stack), "One per line.") +
          '<div class="row">' + text("projects." + i + ".github", "GitHub link", it.github) + text("projects." + i + ".demo", "Live demo link", it.demo) + '</div>';
      }, { name: "New project", stack: [], description: [], github: "", demo: "" });

      h += list("education", "Education", D.education, "Entry", function (it, i) {
        return text("education." + i + ".degree", "Degree", it.degree) + text("education." + i + ".school", "School", it.school) + text("education." + i + ".period", "Period", it.period);
      }, { degree: "", school: "", period: "" });

      h += list("certifications", "Certifications", D.certifications, "Certificate", function (it, i) {
        return text("certifications." + i + ".title", "Title", it.title) + '<div class="row">' + text("certifications." + i + ".issuer", "Issuer", it.issuer) + text("certifications." + i + ".score", "Score (e.g. 95%)", it.score) + '</div>';
      }, { title: "", issuer: "", score: "" });

      h += '<fieldset><legend>Activities</legend>' + area("activities", "Activities", lines(D.activities), "One per line.") + '</fieldset>';
      form.innerHTML = h;
    }

    function list(key, title, arr, noun, body, blank) {
      var out = '<fieldset><legend>' + title + '</legend>';
      (arr || []).forEach(function (it, i) {
        out += '<div class="item"><div class="item-head"><span>' + noun + ' ' + (i + 1) + '</span><button type="button" class="small danger" data-del="' + key + ':' + i + '">Remove</button></div>' + body(it, i) + '</div>';
      });
      return out + '<p><button type="button" class="small" data-add="' + key + '">+ Add ' + noun.toLowerCase() + '</button></p></fieldset>';
    }

    var blanks = {
      stats: { value: 0, suffix: "", label: "" },
      skills: { group: "New group", icon: "code", items: [] },
      projects: { name: "New project", stack: [], description: [], github: "", demo: "" },
      education: { degree: "", school: "", period: "" },
      certifications: { title: "", issuer: "", score: "" }
    };
    var ARRAY_FIELDS = /(^|\.)(roles|interests|items|stack|description|activities)$/;

    function setPath(obj, path, val) {
      var p = path.split("."), o = obj;
      for (var i = 0; i < p.length - 1; i++) o = o[p[i]];
      o[p[p.length - 1]] = val;
    }
    form.addEventListener("input", function (e) {
      var el = e.target, k = el.dataset.k;
      if (!k) return;
      var v = el.type === "checkbox" ? el.checked : el.value;
      if (ARRAY_FIELDS.test(k)) v = el.value.split("\n").map(function (s) { return s.trim(); }).filter(Boolean);
      else if (/\.value$/.test(k)) v = Number(v) || 0;
      if (k === "about.interests") v = el.value.split("\n").map(function (s) { return s.trim(); }).filter(Boolean);
      setPath(D, k, v);
    });
    form.addEventListener("click", function (e) {
      var add = e.target.dataset.add, del = e.target.dataset.del;
      if (add) { D[add].push(JSON.parse(JSON.stringify(blanks[add]))); render(); }
      if (del) { var p = del.split(":"); D[p[0]].splice(+p[1], 1); render(); }
    });

    function output() { return "/* Generated by editor.html */\nconst PORTFOLIO = " + JSON.stringify(D, null, 2) + ";\n"; }
    var toastEl = document.getElementById("toast");
    function toast(m) { toastEl.textContent = m; toastEl.classList.add("show"); setTimeout(function () { toastEl.classList.remove("show"); }, 2400); }

    document.getElementById("btnDownload").onclick = function () {
      var a = document.createElement("a");
      a.href = URL.createObjectURL(new Blob([output()], { type: "text/javascript" }));
      a.download = "data.js"; a.click(); URL.revokeObjectURL(a.href);
      toast("data.js downloaded. Replace the old one.");
    };
    document.getElementById("btnCopy").onclick = function () {
      (navigator.clipboard ? navigator.clipboard.writeText(output()) : Promise.reject()).then(function () { toast("Copied to clipboard"); }, function () { toast("Copy blocked. Use Download instead."); });
    };
    document.getElementById("btnPreview").onclick = function () {
      try { localStorage.setItem("portfolio-preview", JSON.stringify(D)); window.open("index.html?preview=1", "_blank"); }
      catch (e) { toast("Preview needs browser storage. Use Download instead."); }
    };
    render();
  })();
  </script>
</body>
</html>
